name: Build Windows distribution
on:
  pull_request:
  push:
    tags: ["v3.0.0"]
  workflow_dispatch:
jobs:
  windows:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python build.py
      - name: Create portable archive
        run: Compress-Archive -Path dist/BinaryReceptor.exe,dist/settings.ini -DestinationPath BinaryReceptor-v3.0.0-win64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: BinaryReceptor-v3.0.0-win64
          path: BinaryReceptor-v3.0.0-win64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BinaryReceptor-v3.0.0-win64
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v3.0.0 BinaryReceptor-v3.0.0-win64.zip --title "BinaryReceptor v3.0.0" --generate-notes
        shell: pwsh
